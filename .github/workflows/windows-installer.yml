name: Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python 3.11 x64
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: x64
          cache: pip

      - name: Read application version
        shell: pwsh
        run: |
          $version = python -c "import pathlib,tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])"
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $expectedTag = "v$env:APP_VERSION"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Release tag '$env:GITHUB_REF_NAME' does not match application version '$expectedTag'"
          }

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,packaging]"

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Generate Windows icon
        run: python packaging/windows/make_icon.py

      - name: Build one-folder application
        run: python -m PyInstaller --noconfirm --clean packaging/windows/photochoose.spec

      - name: Smoke-test portable executable
        shell: pwsh
        run: |
          $env:PHOTOCHOOSE_SMOKE_LOG = Join-Path $env:RUNNER_TEMP "photochoose-portable-smoke.log"
          $process = Start-Process ".\dist\PhotoChoose\PhotoChoose.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            if (Test-Path $env:PHOTOCHOOSE_SMOKE_LOG) {
              Get-Content $env:PHOTOCHOOSE_SMOKE_LOG
            }
            throw "Portable PhotoChoose smoke test failed with exit code $($process.ExitCode)"
          }

      - name: Create portable diagnostic ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path dist\PhotoChoose -DestinationPath "release\PhotoChoose-portable-$env:APP_VERSION-x64.zip" -CompressionLevel Optimal

      - name: Install Inno Setup
        run: choco install innosetup --version=6.7.1 --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DAppVersion=$env:APP_VERSION" "packaging\windows\photochoose.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }

      - name: Verify install, in-place upgrade, and uninstaller
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $installer = Get-Item "release\PhotoChoose-Setup-$env:APP_VERSION-x64.exe"
          $legacyInstallerDir = Join-Path $env:RUNNER_TEMP "legacy-installer"
          New-Item -ItemType Directory -Force -Path $legacyInstallerDir | Out-Null
          gh release download v0.1.2 --repo $env:GITHUB_REPOSITORY --pattern "PhotoChoose-Setup-0.1.2-x64.exe" --dir $legacyInstallerDir
          if ($LASTEXITCODE -ne 0) {
            throw "Could not download the legacy installer for the migration test"
          }
          $legacyInstaller = Get-Item "$legacyInstallerDir\PhotoChoose-Setup-0.1.2-x64.exe"
          $legacyInstallDir = Join-Path $env:LOCALAPPDATA "Programs\PhotoChoose"
          $legacyInstall = Start-Process $legacyInstaller.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($legacyInstall.ExitCode -ne 0 -or -not (Test-Path "$legacyInstallDir\PhotoChoose.exe")) {
            throw "Legacy per-user installation failed"
          }
          $dataDir = Join-Path $env:APPDATA "PhotoChoose\PhotoChoose"
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          $dataMarker = Join-Path $dataDir "installer-migration-marker.txt"
          Set-Content -Path $dataMarker -Value "preserve user data"

          $installDir = Join-Path $env:ProgramFiles "PhotoChoose"
          $install = Start-Process $installer.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "Installer failed with exit code $($install.ExitCode)"
          }
          if (-not (Test-Path "$installDir\PhotoChoose.exe")) {
            throw "PhotoChoose was not installed under Program Files"
          }
          if (Test-Path "$legacyInstallDir\PhotoChoose.exe") {
            throw "Legacy Local AppData application files were not removed"
          }
          if (-not (Test-Path $dataMarker)) {
            throw "The installer migration removed user data"
          }
          $env:PHOTOCHOOSE_SMOKE_LOG = Join-Path $env:RUNNER_TEMP "photochoose-installed-smoke.log"
          $smoke = Start-Process "$installDir\PhotoChoose.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if ($smoke.ExitCode -ne 0) {
            if (Test-Path $env:PHOTOCHOOSE_SMOKE_LOG) {
              Get-Content $env:PHOTOCHOOSE_SMOKE_LOG
            }
            throw "Installed PhotoChoose smoke test failed with exit code $($smoke.ExitCode)"
          }
          $upgrade = Start-Process $installer.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($upgrade.ExitCode -ne 0) {
            throw "In-place upgrade failed with exit code $($upgrade.ExitCode)"
          }
          $upgradeSmoke = Start-Process "$installDir\PhotoChoose.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if ($upgradeSmoke.ExitCode -ne 0) {
            if (Test-Path $env:PHOTOCHOOSE_SMOKE_LOG) {
              Get-Content $env:PHOTOCHOOSE_SMOKE_LOG
            }
            throw "Upgraded PhotoChoose smoke test failed with exit code $($upgradeSmoke.ExitCode)"
          }
          $uninstall = Start-Process "$installDir\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            throw "Uninstaller failed with exit code $($uninstall.ExitCode)"
          }
          if (-not (Test-Path $dataMarker)) {
            throw "Uninstall removed the catalog data directory"
          }

      - name: Write SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem release\*.exe, release\*.zip | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Out-File release\SHA256SUMS.txt -Encoding ascii
          Get-Content release\SHA256SUMS.txt

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PhotoChoose-Windows-x64-${{ env.APP_VERSION }}
          path: |
            release/PhotoChoose-Setup-*.exe
            release/PhotoChoose-portable-*.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            "release/PhotoChoose-Setup-$env:APP_VERSION-x64.exe"
            "release/PhotoChoose-portable-$env:APP_VERSION-x64.zip"
            "release/SHA256SUMS.txt"
          )
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME $assets --clobber
          }
          else {
            gh release create $env:GITHUB_REF_NAME $assets --verify-tag --generate-notes --latest --title "PhotoChoose $env:APP_VERSION"
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Publishing GitHub release failed with exit code $LASTEXITCODE"
          }

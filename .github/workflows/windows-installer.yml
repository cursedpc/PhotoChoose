name: Windows and macOS release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python 3.11 x64
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: x64
          cache: pip

      - name: Read application version
        shell: pwsh
        run: |
          $version = python -c "import pathlib,tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])"
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $expectedTag = "v$env:APP_VERSION"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Release tag '$env:GITHUB_REF_NAME' does not match application version '$expectedTag'"
          }

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,packaging]"

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Generate Windows icon
        run: python packaging/windows/make_icon.py

      - name: Build one-folder application
        run: python -m PyInstaller --noconfirm --clean packaging/windows/photochoose.spec

      - name: Smoke-test portable executable
        shell: pwsh
        run: |
          $env:PHOTOCHOOSE_SMOKE_LOG = Join-Path $env:RUNNER_TEMP "photochoose-portable-smoke.log"
          $process = Start-Process ".\dist\PhotoChoose\PhotoChoose.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            if (Test-Path $env:PHOTOCHOOSE_SMOKE_LOG) {
              Get-Content $env:PHOTOCHOOSE_SMOKE_LOG
            }
            throw "Portable PhotoChoose smoke test failed with exit code $($process.ExitCode)"
          }

      - name: Create portable diagnostic ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path dist\PhotoChoose -DestinationPath "release\PhotoChoose-portable-$env:APP_VERSION-x64.zip" -CompressionLevel Optimal

      - name: Install Inno Setup
        run: choco install innosetup --version=6.7.1 --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DAppVersion=$env:APP_VERSION" "packaging\windows\photochoose.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }

      - name: Verify install, in-place upgrade, and uninstaller
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $installer = Get-Item "release\PhotoChoose-Setup-$env:APP_VERSION-x64.exe"
          $legacyInstallerDir = Join-Path $env:RUNNER_TEMP "legacy-installer"
          New-Item -ItemType Directory -Force -Path $legacyInstallerDir | Out-Null
          gh release download v0.1.2 --repo $env:GITHUB_REPOSITORY --pattern "PhotoChoose-Setup-0.1.2-x64.exe" --dir $legacyInstallerDir
          if ($LASTEXITCODE -ne 0) {
            throw "Could not download the legacy installer for the migration test"
          }
          $legacyInstaller = Get-Item "$legacyInstallerDir\PhotoChoose-Setup-0.1.2-x64.exe"
          $legacyInstallDir = Join-Path $env:LOCALAPPDATA "Programs\PhotoChoose"
          $legacyInstall = Start-Process $legacyInstaller.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($legacyInstall.ExitCode -ne 0 -or -not (Test-Path "$legacyInstallDir\PhotoChoose.exe")) {
            throw "Legacy per-user installation failed"
          }
          $dataDir = Join-Path $env:APPDATA "PhotoChoose\PhotoChoose"
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          $dataMarker = Join-Path $dataDir "installer-migration-marker.txt"
          Set-Content -Path $dataMarker -Value "preserve user data"

          $installDir = Join-Path $env:ProgramFiles "PhotoChoose"
          $install = Start-Process $installer.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "Installer failed with exit code $($install.ExitCode)"
          }
          if (-not (Test-Path "$installDir\PhotoChoose.exe")) {
            throw "PhotoChoose was not installed under Program Files"
          }
          if (Test-Path "$legacyInstallDir\PhotoChoose.exe") {
            throw "Legacy Local AppData application files were not removed"
          }
          if (-not (Test-Path $dataMarker)) {
            throw "The installer migration removed user data"
          }
          $env:PHOTOCHOOSE_SMOKE_LOG = Join-Path $env:RUNNER_TEMP "photochoose-installed-smoke.log"
          $smoke = Start-Process "$installDir\PhotoChoose.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if ($smoke.ExitCode -ne 0) {
            if (Test-Path $env:PHOTOCHOOSE_SMOKE_LOG) {
              Get-Content $env:PHOTOCHOOSE_SMOKE_LOG
            }
            throw "Installed PhotoChoose smoke test failed with exit code $($smoke.ExitCode)"
          }
          $upgrade = Start-Process $installer.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($upgrade.ExitCode -ne 0) {
            throw "In-place upgrade failed with exit code $($upgrade.ExitCode)"
          }
          $upgradeSmoke = Start-Process "$installDir\PhotoChoose.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if ($upgradeSmoke.ExitCode -ne 0) {
            if (Test-Path $env:PHOTOCHOOSE_SMOKE_LOG) {
              Get-Content $env:PHOTOCHOOSE_SMOKE_LOG
            }
            throw "Upgraded PhotoChoose smoke test failed with exit code $($upgradeSmoke.ExitCode)"
          }
          $uninstall = Start-Process "$installDir\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            throw "Uninstaller failed with exit code $($uninstall.ExitCode)"
          }
          if (-not (Test-Path $dataMarker)) {
            throw "Uninstall removed the catalog data directory"
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PhotoChoose-Windows-x64-${{ env.APP_VERSION }}
          path: |
            release/PhotoChoose-Setup-*.exe
            release/PhotoChoose-portable-*.zip
          if-no-files-found: error
          retention-days: 14

  build-macos:
    name: Build macOS ${{ matrix.display_name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        include:
          - display_name: Intel
            runner: macos-15-intel
            python_architecture: x64
            target_architecture: x86_64
            openvino_version: 2025.4.1
            litert_version: 1.0.1
            dmg_suffix: Intel
          - display_name: Apple Silicon
            runner: macos-15
            python_architecture: arm64
            target_architecture: arm64
            openvino_version: 2026.1.0
            litert_version: 2.1.6
            dmg_suffix: Apple-Silicon

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python 3.11 ${{ matrix.target_architecture }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: ${{ matrix.python_architecture }}
          cache: pip

      - name: Read application version
        shell: bash
        run: |
          version=$(python -c "import pathlib,tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])")
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          expected_tag="v$APP_VERSION"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Release tag '$GITHUB_REF_NAME' does not match application version '$expected_tag'" >&2
            exit 1
          fi

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,packaging]"

      - name: Confirm native dependency architecture
        run: |
          test "$(uname -m)" = "${{ matrix.target_architecture }}"
          python - <<'PY'
          import importlib.metadata
          import platform

          expected_architecture = "${{ matrix.target_architecture }}"
          assert platform.machine() == expected_architecture, platform.machine()
          assert importlib.metadata.version("openvino") == "${{ matrix.openvino_version }}"
          assert importlib.metadata.version("ai-edge-litert") == "${{ matrix.litert_version }}"
          PY

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Normalize Apple Silicon OpenVINO Mach-O metadata
        if: matrix.target_architecture == 'arm64'
        run: python packaging/macos/normalize_openvino_arm64.py

      - name: Build native application bundle
        run: python -m PyInstaller --noconfirm --clean packaging/macos/photochoose.spec

      - name: Prepare unsigned application bundle
        shell: bash
        run: |
          xattr -cr dist/PhotoChoose.app
          codesign --force --deep --sign - dist/PhotoChoose.app
          codesign --verify --deep --strict --verbose=2 dist/PhotoChoose.app

      - name: Verify and smoke-test application bundle
        shell: bash
        run: |
          checked=0
          while IFS= read -r -d '' candidate; do
            if file "$candidate" | grep -q "Mach-O"; then
              lipo -verify_arch "${{ matrix.target_architecture }}" "$candidate"
              checked=$((checked + 1))
            fi
          done < <(find dist/PhotoChoose.app -type f -print0)
          test "$checked" -gt 0
          test "$(lipo -archs dist/PhotoChoose.app/Contents/MacOS/PhotoChoose)" = "${{ matrix.target_architecture }}"
          export PHOTOCHOOSE_SMOKE_LOG="$RUNNER_TEMP/photochoose-macos-smoke.log"
          if ! dist/PhotoChoose.app/Contents/MacOS/PhotoChoose --smoke-test; then
            test ! -f "$PHOTOCHOOSE_SMOKE_LOG" || cat "$PHOTOCHOOSE_SMOKE_LOG"
            exit 1
          fi

      - name: Create unsigned ${{ matrix.display_name }} DMG
        shell: bash
        run: |
          mkdir -p release/dmg-root
          ditto --noextattr --noacl dist/PhotoChoose.app release/dmg-root/PhotoChoose.app
          ln -s /Applications release/dmg-root/Applications
          hdiutil create -volname PhotoChoose -srcfolder release/dmg-root -ov -format UDZO \
            "release/PhotoChoose-$APP_VERSION-macOS-${{ matrix.dmg_suffix }}.dmg"

      - name: Verify DMG contents
        shell: bash
        run: |
          mount_point="$RUNNER_TEMP/photochoose-dmg"
          mkdir -p "$mount_point"
          hdiutil attach "release/PhotoChoose-$APP_VERSION-macOS-${{ matrix.dmg_suffix }}.dmg" \
            -readonly -nobrowse -mountpoint "$mount_point"
          test -x "$mount_point/PhotoChoose.app/Contents/MacOS/PhotoChoose"
          test "$(lipo -archs "$mount_point/PhotoChoose.app/Contents/MacOS/PhotoChoose")" = "${{ matrix.target_architecture }}"
          hdiutil detach "$mount_point"

      - name: Upload ${{ matrix.display_name }} macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoChoose-macOS-${{ matrix.dmg_suffix }}-${{ env.APP_VERSION }}
          path: release/PhotoChoose-*-macOS-${{ matrix.dmg_suffix }}.dmg
          if-no-files-found: error
          retention-days: 14

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-windows-installer
      - build-macos
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Download tested release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Write SHA-256 checksums
        shell: bash
        run: |
          cd release
          sha256sum PhotoChoose-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(python -c "import pathlib,tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])")
          release_tag="v$version"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "$release_tag" ]]; then
            echo "Release tag '$GITHUB_REF_NAME' does not match application version '$release_tag'" >&2
            exit 1
          fi
          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" release/* --clobber
          else
            gh release create "$release_tag" release/* --verify-tag --generate-notes \
              --latest --title "PhotoChoose $version"
          fi

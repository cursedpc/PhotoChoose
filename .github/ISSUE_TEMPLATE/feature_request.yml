name: Feature request
description: Suggest an improvement for PhotoChoose
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: need
    attributes:
      label: What problem would this solve?
      description: Describe the workflow or difficulty, not only the proposed control.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain how you would expect the feature to work.
    validations:
      required: true
  - type: dropdown
    id: platforms
    attributes:
      label: Relevant platforms
      multiple: true
      options:
        - Windows x64
        - macOS Intel
        - macOS Apple Silicon
        - All platforms
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add mockups or examples if useful. Do not upload photographs or data you cannot share publicly.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked existing issues for a similar request.
          required: true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photochoose"
version = "0.1.0"
description = "Local-first desktop photo culling for professional shoots"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    # Qt 6.10.3 currently fails platform-plugin discovery on the Intel macOS
    # development machine; keep the stable 6.9 line until that is resolved.
    "PySide6>=6.9,<6.10",
    "numpy>=1.24,<2",
    "opencv-python-headless>=4.8,<4.12",
    "ai-edge-litert>=1.0.1,<3",
    # 2025.4.1 is the latest release with matching Intel-macOS and Windows wheels.
    "openvino==2025.4.1",
]

[project.optional-dependencies]
dev = [
    "ruff",
]

[project.scripts]
photochoose = "photochoose.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
photochoose = ["branding/*", "model_assets/*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

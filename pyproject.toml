[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photochoose"
version = "0.1.5"
description = "Local-first desktop photo culling for professional shoots"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    # Qt 6.10.3 currently fails platform-plugin discovery on the Intel macOS
    # development machine; keep the stable 6.9 line until that is resolved.
    "PySide6>=6.9,<6.10",
    "numpy>=1.24,<2",
    "opencv-python-headless>=4.8,<4.12",
    "Pillow>=12,<13",
    # Decode-only HEIF wheels exist for Windows x64, Intel macOS, and arm64
    # macOS without bundling the unneeded GPL x265 encoder.
    "pi-heif==1.4.0",
    # Intel macOS only publishes the 1.0.x wheel. Windows and Apple Silicon
    # publish the validated 2.1.6 wheel for CPython 3.11.
    "ai-edge-litert==1.0.1; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "ai-edge-litert==2.1.6; sys_platform != 'darwin' or platform_machine == 'arm64'",
    # Keep the validated 2025.4.1 runtime on Intel macOS and Windows. Its ARM64
    # wheel contains TBB libraries that macOS cannot re-sign during packaging.
    "openvino==2025.4.1; sys_platform != 'darwin' or platform_machine != 'arm64'",
    # The 2026.1 ARM64 runtime is normalized before PyInstaller packages it.
    "openvino==2026.1.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
dev = [
    "ruff",
]
packaging = [
    "pyinstaller==6.21.0",
]

[project.scripts]
photochoose = "photochoose.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
photochoose = ["branding/*", "model_assets/*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
